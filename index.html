  stage.appendChild(el);
}

function render(filter){
  list.innerHTML = '';
  FILES.filter(function(f){ return !filter || f.toLowerCase().indexOf(filter) >= 0; }).forEach(function(f){
    var b = document.createElement('button');
    b.className = 'item'; b.textContent = f;
    b.onclick = function(){
      Array.prototype.forEach.call(list.children, function(c){ c.classList.remove('on'); });
      b.classList.add('on');
      preview(f);
    };
    list.appendChild(b);
  });
}
document.getElementById('q').addEventListener('input', function(ev){ render(ev.target.value.toLowerCase()); });
render('');

// Auto-open the most interesting file so something is visible right away.
var first = FILES.filter(function(f){ return /\.html?$/i.test(f); })[0]
  || FILES.filter(function(f){ return /\.(png|jpe?g|gif|webp|svg)$/i.test(f); })[0]
  || FILES[0];
if (first) { var i = FILES.indexOf(first); if (list.children[i]) list.children[i].click(); }
</script></body></html>
